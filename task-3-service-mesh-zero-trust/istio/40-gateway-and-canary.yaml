# BONUS: ingress gateway with TLS termination, and a canary split.
#
# Applied separately from the core task. The gateway is where the mesh boundary
# becomes a PCI CDE boundary, so it is worth being explicit about what is being
# exposed and what is deliberately not.
#
# WHAT IS EXPOSED, AND WHAT IS NOT
# ---------------------------------------------------------------------------
# `reporting` is exposed. `ledger-api` is NOT, and that is the whole point.
#
# ledger-api's GET /transactions returns full PANs. reporting deliberately does
# not propagate them - it aggregates by currency and status and returns counts
# and totals only (see task-1/neighbour-source/app.py). So:
#
#   - ledger-api is IN the cardholder data environment. It holds and returns
#     PANs, and it has exactly one legitimate caller inside the namespace.
#     Putting it behind an ingress would place a CDE system on the edge, where
#     every internet-facing control becomes in-scope for assessment.
#   - reporting is OUT of CDE scope by construction, because the data it emits
#     contains no cardholder data. Exposing it does not drag the CDE outward.
#
# That is scope reduction by data minimisation rather than by network drawing,
# and it is the more durable of the two: a firewall rule can be changed by
# anyone with access to the firewall, whereas reporting cannot leak a PAN it
# never receives.
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: payments-gateway
  namespace: payments
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        # TLS terminates AT THE GATEWAY, and the hop from gateway to workload is
        # then re-encrypted by the mesh's own mTLS. Traffic is never in
        # cleartext on the wire, but it IS briefly in cleartext inside the
        # gateway process - which is why the gateway is itself in CDE scope and
        # has to be treated as a cardholder-data system even though it stores
        # nothing.
        mode: SIMPLE
        credentialName: payments-gateway-tls   # secret must live in istio-system
        minProtocolVersion: TLSV1_3
        # TLS 1.3 only. PCI DSS 4.0 requires TLS 1.2 as a floor; 1.3 is chosen
        # because it removes the negotiable weak ciphers entirely rather than
        # relying on a cipher allow-list staying correct over time.
      hosts:
        - payments.local
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - payments.local
      tls:
        # Redirect rather than serve. An open :80 that answers is an invitation
        # to a downgrade; one that only ever 301s is not.
        httpsRedirect: true
---
# Canary: 90% to v1, 10% to v2.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reporting
  namespace: payments
spec:
  hosts:
    - payments.local
  gateways:
    - payments-gateway
  http:
    - match:
        - uri:
            prefix: /summary
      route:
        - destination:
            host: reporting
            subset: v1
            port:
              number: 8081
          weight: 90
        - destination:
            host: reporting
            subset: v2
            port:
              number: 8081
          weight: 10
      timeout: 10s
      retries:
        # Retry only on conditions that are safe to repeat. Retrying a 5xx from
        # a non-idempotent endpoint turns one failed write into several; these
        # are connection-level failures where the request provably never
        # reached the application.
        attempts: 2
        perTryTimeout: 3s
        retryOn: connect-failure,refused-stream,unavailable
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: reporting
  namespace: payments
spec:
  host: reporting
  trafficPolicy:
    tls:
      # ISTIO_MUTUAL, not DISABLE and not SIMPLE. The gateway presents the
      # mesh-issued client certificate on the upstream hop, so the workload's
      # STRICT PeerAuthentication is satisfied and the gateway is subject to
      # the same identity-based authorization as any other caller.
      mode: ISTIO_MUTUAL
    outlierDetection:
      # Eject an instance that returns 5 consecutive 5xx. This is what makes a
      # canary safe to leave running unattended: a bad v2 removes itself from
      # the pool instead of serving 10% errors until someone notices.
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
# Authorization for the gateway hop.
#
# Required because default-deny-all in 20-authorization-policy.yaml covers the
# whole namespace: without this the gateway is refused exactly like any other
# unauthorised caller. Granting it explicitly keeps external exposure a
# deliberate act rather than something a broad namespace rule permitted by
# accident.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-to-reporting
  namespace: payments
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting
  action: ALLOW
  rules:
    - from:
        - source:
            # The ingress gateway's own workload identity. Note this grants the
            # GATEWAY access, not "the internet" - anything arriving through it
            # is still subject to whatever the gateway itself enforces.
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            methods: ["GET"]
            paths: ["/summary", "/health"]
