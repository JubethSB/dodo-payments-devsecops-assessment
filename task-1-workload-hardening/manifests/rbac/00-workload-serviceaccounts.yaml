# Workload identities for ledger-api and its neighbour.
#
# ── Why a dedicated ServiceAccount at all ────────────────────────────────────
# The starter Deployment specified no serviceAccountName, so it silently ran as
# the namespace `default` SA. That is bad for two reasons:
#   1. The default SA is shared by every workload in the namespace, so any RBAC
#      ever granted to it is inherited by everything — you can never scope a
#      permission to one service.
#   2. It defeats identity-based authorisation. Task 3 keys Istio
#      AuthorizationPolicies on the SPIFFE ID derived from the ServiceAccount
#      (spiffe://cluster.local/ns/payments/sa/<name>). With everything on
#      `default`, every workload has the same identity and "allow reporting to
#      call ledger-api" becomes unexpressable.
#
# ── Why there is no Role/RoleBinding for ledger-api ──────────────────────────
# This is deliberate, not an omission. ledger-api's source (app-source/app/app.py)
# makes zero calls to the Kubernetes API — it is a plain Flask app serving
# /health, /tokenize, /transactions, /import and /fetch. Its configuration
# arrives as env vars from a ConfigMap and a Secret, which the kubelet mounts;
# the pod itself never talks to the API server.
#
# Least privilege for a workload that needs no API access is therefore *no
# permissions at all*, plus no token to present. Granting a token "just in case"
# would hand an attacker who achieves RCE (and note: /import is a YAML
# deserialisation sink) a credential to pivot against the API server.
#
# Hence: dedicated SA + automountServiceAccountToken: false, and no Role bound.
# Human-facing RBAC for the developer/operator/admin personas lives in
# 10-persona-roles.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  namespace: payments
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/part-of: payments-platform
# Belt-and-braces: even if a pod spec forgets to disable the mount, the SA
# itself refuses to project a token. Set in both places on purpose.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting
  namespace: payments
  labels:
    app.kubernetes.io/name: reporting
    app.kubernetes.io/part-of: payments-platform
automountServiceAccountToken: false
