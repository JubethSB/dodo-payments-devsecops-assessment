# Non-secret configuration for ledger-api.
#
# Design rule applied throughout this task:
#   ConfigMap = non-sensitive config (URLs, timeouts, log level, feature flags)
#   Secret    = credentials only (STRIPE_API_KEY, DB_PASSWORD), sealed, see ../secrets/
#
# The starter shipped credentials inline in the Deployment's env: block. That
# is the single worst issue in the original manifest set, because it puts a
# live Stripe key into git history where every developer, CI job and fork can
# read it. Splitting config from secrets is the precondition for fixing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api-config
  namespace: payments
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/part-of: payments-platform
data:
  # Gunicorn / app runtime tuning
  LOG_LEVEL: "info"
  APP_PORT: "8080"
  # Stop CPython writing .pyc files. Required because the container runs with
  # a read-only root filesystem, without this the interpreter tries to write
  # bytecode next to the source and logs errors on every import.
  PYTHONDONTWRITEBYTECODE: "1"
  # Unbuffered stdout so logs reach the container runtime immediately and are
  # not lost if the process is killed (important for audit trails in PCI scope).
  PYTHONUNBUFFERED: "1"
